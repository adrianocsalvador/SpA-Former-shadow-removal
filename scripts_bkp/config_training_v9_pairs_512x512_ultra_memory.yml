# Configuração ULTRA otimizada para VRAM limitada com janelas 512x512
datasets_dir: /mnt/48EC7EE9EC7ED0A4/Teste_Sombra/dataset_v9_pairs_512x512/train
valset_dir: /mnt/48EC7EE9EC7ED0A4/Teste_Sombra/dataset_v9_pairs_512x512/test
train_list: train_list.txt
validation_list: val_list.txt
out_dir: ./results_training_v9_pairs_512x512_ultra
cuda: True
gpu_ids: [0]
batchsize: 1
validation_batchsize: 1
epoch: 20
window_width: 512
window_height: 512
stride_width: 256
stride_height: 256
threads: 1
lr: 0.0001
gen_init: ./models/gen/gen_model_epoch_160.pth
manualSeed: 42
snapshot_interval: 1

# Otimizações de memória ULTRA
enable_memory_optimization: True
use_mixed_precision: False
gradient_accumulation_steps: 16
enable_gradient_checkpointing: True
enable_memory_cleanup: True
max_image_size: 1024
enable_memory_fragmentation_fix: True
enable_aggressive_cleanup: True
cleanup_frequency: 5

# Parâmetros de loss adaptativa
lambda_whitening: 15
contrast_threshold: 30
shadow_threshold: 0.1

# Configurações do modelo
in_ch: 3
out_ch: 3
beta1: 0.5
lamb: 100


