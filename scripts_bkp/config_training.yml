# Configuração para treinamento com correção de branqueamento
datasets_dir: ./data/panoramic/train
valset_dir: ./data/panoramic/test
train_list: train_list.txt
test_list: 
validation_list: val_list.txt
out_dir: ./results_training

cuda: True
gpu_ids: [0]

# Configurações otimizadas para VRAM limitada
batchsize: 1  # Batch size mínimo
validation_batchsize: 1
epoch: 50  # Menos épocas para teste inicial
n_data: 433

# Tamanho da janela otimizado para treinamento
window_width: 256   # Janela pequena para economizar memória
window_height: 256
stride_width: 128    # 50% overlap
stride_height: 128

# Configurações de memória
threads: 2
lr: 0.0001  # Learning rate menor para fine-tuning
beta1: 0.5
lamb: 100
minimax: 1

# Modelo pré-treinado para fine-tuning
gen_init: ./models/gen/gen_model_epoch_160.pth  # Carregar modelo existente
dis_init: 
in_ch: 3
out_ch: 3

manualSeed: 42
snapshot_interval: 5  # Salvar a cada 5 épocas

# Configurações específicas para treinamento
enable_memory_optimization: True
use_mixed_precision: True  # FP16 para economizar memória
gradient_accumulation_steps: 8  # Acumular mais gradientes
enable_gradient_checkpointing: True

# Configurações de loss adaptativa
lambda_whitening: 10  # Peso da penalização de branqueamento
contrast_threshold: 30  # Threshold para baixo contraste
shadow_threshold: 0.1  # Threshold para detectar sombras
